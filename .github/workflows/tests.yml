name: Synthetic tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-colab.txt
      - run: pip install -e '.[test]'
      - run: pytest -q
