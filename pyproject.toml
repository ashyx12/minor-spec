[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics-colab"
version = "1.0.0"
description = "Reproducible transaction analytics, evaluated in Google Colab"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<1.9", "mlxtend==0.23.4", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
